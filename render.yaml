databases:
  - name: event-management-db
    plan: free
    databaseName: event_management
    user: event_management_user

services:
  # ── API (Docker) ──────────────────────────────────────────────
  - type: web
    name: event-management-api
    runtime: docker
    plan: free
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    healthCheckPath: /api/docs
    envVars:
      - key: NODE_ENV
        value: production
      - key: BACKEND_PORT
        value: "10000"
      - key: CORS_ORIGIN
        value: https://event-management-web-5hdt.onrender.com
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: DB_HOST
        fromDatabase:
          name: event-management-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: event-management-db
          property: port
      - key: DB_USERNAME
        fromDatabase:
          name: event-management-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: event-management-db
          property: password
      - key: DB_NAME
        fromDatabase:
          name: event-management-db
          property: database
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: GROQ_MAX_TOKENS
        value: "1024"
      - key: GROQ_TEMPERATURE
        value: "0.7"
      - key: GROQ_MAX_INPUT_TOKENS
        value: "4096"

  # ── Frontend (Static Site) ────────────────────────────────────
  - type: web
    name: event-management-web
    runtime: static
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @event-management/shared run build && pnpm --filter @event-management/web run build
    staticPublishPath: ./apps/web/dist
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    routes:
      - type: rewrite
        source: /api/*
        destination: https://event-management-api-t0tc.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
